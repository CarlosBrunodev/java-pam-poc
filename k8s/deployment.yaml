apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-pam-poc
  namespace: java-pam-poc
  labels:
    app: java-pam-poc
spec:
  replicas: 1   
  selector:
    matchLabels:
      app: java-pam-poc
  template:
    metadata:
      labels:
        app: java-pam-poc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "carlosbrunodev/java-pam-poc:0.0.2"   
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: java-pam-poc-config
            - secretRef:
                name: delinea-credentials
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi   
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24  
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp  
      volumes:
        - name: tmp
          emptyDir: {}
